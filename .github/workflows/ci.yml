name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity (test fixtures commit without global config)
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Public hygiene scan (block words = red)
        run: node scripts/tf.mjs hygiene

      - name: Lint (docs / registry consistency)
        run: node scripts/tf.mjs lint

      - name: Full regression tests
        run: node scripts/tf.test.mjs
