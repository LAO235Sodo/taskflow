name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Public hygiene scan (block words = red)
        run: node scripts/tf.mjs hygiene

      - name: Lint (docs / registry consistency)
        run: node scripts/tf.mjs lint

      - name: Full regression tests
        run: node scripts/tf.test.mjs
